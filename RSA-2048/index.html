<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Descriptografia RSA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background-color: #000000;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #6e8194;
    }

    h2{
      text-align: center;
      color: #d7e1eb;
    }

    .card {
      background: #4b4646;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label {
      font-weight: bold;
      color: #fdfdfd;
      display: block;
      margin-top: 10px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #3498db;
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #2980b9;
    }
    .key-box {
      background: #4b4d4e;
      border-left: 4px solid #3498db;
      padding: 10px;
      margin-top: 10px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h1>Testador RSA</h1>

  <!-- Configuração das Chaves -->
  <div class="card">
    <h2>1. Parâmetros (Primos p e q)</h2>
    <div class="grid">
      <div>
        <label for="p">Número Primo p:</label>
        <input type="number" id="p" value="61" placeholder="Ex: 61">
      </div>
      <div>
        <label for="q">Número Primo q:</label>
        <input type="number" id="q" value="53" placeholder="Ex: 53">
      </div>
    </div>
    <button onclick="gerarChaves()">Calcular Chaves</button>

    <div class="key-box">
      <p><strong>Chave Pública (e, n):</strong> <span id="public-key">-</span></p>
      <p><strong>Chave Privada (d, n):</strong> <span id="private-key">-</span></p>
    </div>
  </div>

  <!-- Descriptografia -->
  <div class="card">
    <h2>2. Descriptografar Texto</h2>
    <label for="cipherText">Texto Criptografado (números separados por espaço):</label>
    <textarea id="cipherText" rows="3" placeholder="Ex: 2790 2000 1500"></textarea>

    <button onclick="descriptografar()">Descriptografar</button>

    <label for="decryptedText">Texto Descriptografado:</label>
    <textarea id="decryptedText" rows="3" readonly></textarea>
  </div>

  <script>
    let keyRSA = { e: 0, d: 0, n: 0 };

    async function gerarChaves() {
        const response = await fetch('http://127.0.0.1:8000/gerar-chaves?bits=2048', { method: 'POST' });
        const data = await response.json();
        
        // Exibe apenas o começo das chaves geradas pela DLL para não quebrar o layout
        document.getElementById('public-key').innerText = `(${data.e}, ${data.n.substring(0, 15)}...)`;
        document.getElementById('private-key').innerText = `(${data.d.substring(0, 15)}..., n)`;
    }

    async function descriptografar() {
        const cifradoHex = document.getElementById('cipherText').value.trim();
        
        const response = await fetch('http://127.0.0.1:8000/descriptografar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hex_cifrado: cifradoHex })
        });
        
        const data = await response.json();
        document.getElementById('decryptedText').value = data.texto || "Erro na descriptografia";
    }

    async function criptografar() {
        // Supondo que criou um <textarea id="plainText"> no seu HTML
        const textoOriginal = document.getElementById('plainText').value.trim();
        
        if (!textoOriginal) return;

        const response = await fetch('http://127.0.0.1:8000/criptografar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ texto: textoOriginal })
        });
        
        const data = await response.json();
        
        // Coloca o resultado hexadecimal no campo de texto cifrado
        document.getElementById('cipherText').value = data.cifrado || "Erro na criptografia";
    }


    // Gera as chaves ao carregar a página com os valores padrão (61 e 53)
    gerarChaves();
  </script>
</body>
</html>
